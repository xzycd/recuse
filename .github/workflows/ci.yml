# Build and test on every push and pull request.
#
# The suite touches no network and runs in under a second, so there is nothing
# to cache beyond the install and no reason to split it into jobs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # The supported LTS floor and the newest LTS line.
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

      # House rules from CLAUDE.md, enforced rather than remembered.
      - name: Project checks
        run: npm run check
