# Build and test on every push and pull request.
#
# The suite touches no network and runs in under a second, so there is nothing
# to cache beyond the install and no reason to split it into jobs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor in package.json engines, and current.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      # House rules from CLAUDE.md, enforced rather than remembered.
      - name: Authorship
        run: node tools/housekeeping.mjs
