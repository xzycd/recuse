name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        type: string
      publish_npm:
        description: Publish the matching version to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm install --global npm@11.12.1

      - name: Validate release ref
        shell: bash
        run: |
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          test "$(git cat-file -t "${RELEASE_TAG}")" = tag
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${RELEASE_TAG}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" origin/main

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit signatures
      - run: npm run check

      - name: Pack checksummed artifact
        shell: bash
        run: |
          mkdir release
          npm pack --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: release
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install --global npm@11.12.1

      - name: Publish to npm with provenance
        shell: bash
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          VERSION="${RELEASE_TAG#v}"
          if npm view "recuse@${VERSION}" version >/dev/null 2>&1; then
            echo "recuse@${VERSION} is already published"
            exit 0
          fi
          npm publish release/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/*.tgz release/SHA256SUMS --clobber
          else
            gh release create "${RELEASE_TAG}" release/*.tgz release/SHA256SUMS \
              --verify-tag --generate-notes --title "${RELEASE_TAG}"
          fi
